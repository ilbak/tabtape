<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 TabTape</title>
<!--
- www.ilbak.it
- github.com/ilbak
-->
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1f232c;
    --border: #2a2f3a; --text: #e6e9ef; --muted: #8b93a7;
    --accent: #4f8cff; --accent-2: #6ee7b7; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif; min-height: 100vh;
  }
  .app { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; margin-bottom: 18px;
  }
  .path-row { display: flex; gap: 10px; flex-wrap: wrap; }
  #pathform {
    flex: 1; min-width: 160px; background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 11px 14px; border-radius: 10px;
    font-size: 0.9rem; outline: none;
  }
  #pathform:read-only { opacity: 0.75; cursor: default; }
  .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 11px 18px; border-radius: 10px; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: filter 0.15s, transform 0.05s;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
  }
  .btn.secondary:hover { background: #262b36; border-color: var(--accent); color: var(--accent); filter: none; }

  #hint {
    font-size: 0.8rem; color: var(--muted);
    margin-bottom: 12px; line-height: 1.4;
    min-height: 1.2em;
  }

  .playlist-toolbar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 12px; align-items: center;
  }
  #searchInput {
    flex: 1; min-width: 120px;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 10px;
    font-size: 0.85rem; outline: none;
  }
  #searchInput:focus { border-color: var(--accent); }
  #searchClearBtn {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--muted); padding: 9px 12px; border-radius: 10px;
    font-size: 0.85rem; cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  #searchClearBtn:hover {
    background: rgba(239, 68, 68, 0.1);
    border-color: var(--danger);
    color: var(--danger);
  }
  #searchClearBtn:disabled {
    opacity: 0.35; cursor: not-allowed;
    background: var(--panel-2); border-color: var(--border); color: var(--muted);
  }
  #sortSelect {
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text); padding: 9px 12px; border-radius: 10px;
    font-size: 0.85rem; outline: none; cursor: pointer;
  }
  #sortSelect:focus { border-color: var(--accent); }

  .playlist { list-style: none; margin: 0; padding: 0; max-height: 320px; overflow-y: auto; }
  .playlist li {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 10px; cursor: pointer;
    font-size: 0.9rem;
  }
  .playlist li:hover { background: var(--panel-2); }
  .playlist li.active { background: rgba(79,140,255,0.12); color: var(--accent); font-weight: 600; }
  .playlist li .idx { color: var(--muted); font-size: 0.75rem; min-width: 22px; font-variant-numeric: tabular-nums; }
  .playlist li .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .playlist .empty { color: var(--muted); font-style: italic; cursor: default; justify-content: center; }

  .comandi { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .ctrl-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--panel-2);
    color: var(--text); cursor: pointer;
  }
  .ctrl-btn.play { background: var(--accent); border-color: var(--accent); color: #fff; width: 60px; height: 60px; }
  .ctrl-btn svg { width: 22px; height: 22px; fill: currentColor; }
  .ctrl-btn.play svg { width: 26px; height: 26px; }
  .now-playing { flex: 1; text-align: right; font-size: 0.85rem; color: var(--muted); }
  .now-playing .title { color: var(--text); font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .progress-row {
    display: flex; align-items: center; gap: 10px;
    margin-top: 16px;
  }
  .progress-row .time {
    font-size: 0.75rem; color: var(--muted); min-width: 44px;
    font-variant-numeric: tabular-nums;
  }
  .progress-row .time.right { text-align: right; }
  #progress {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 4px; background: var(--border); border-radius: 4px;
    outline: none; cursor: pointer;
  }
  #progress:disabled { opacity: 0.4; cursor: not-allowed; }
  #progress::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer;
    transition: transform 0.1s;
  }
  #progress::-webkit-slider-thumb:hover { transform: scale(1.2); }
  #progress::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
  }
  #progress::-moz-range-track { height: 4px; background: var(--border); border-radius: 4px; }

  .random-row { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 0.9rem; }
  .switch { position: relative; width: 44px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: var(--border); border-radius: 24px; transition: background 0.2s; }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: transform 0.2s;
  }
  .switch input:checked + .slider { background: var(--accent-2); }
  .switch input:checked + .slider::before { transform: translateX(20px); }

  /* ---------- Footer ---------- */
  .footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .footer a {
    color: var(--muted);
    text-decoration: none;
    transition: color 0.15s;
  }
  .footer a:hover { color: var(--accent); }
</style>
</head>
<body>
  <div class="app">
    <div class="card">
      <div class="path-row">
        <input type="text" id="pathform" placeholder="No folder selected" readonly>
        <button class="btn secondary" id="refreshBtn" title="Reload the current folder">Refresh</button>
        <button class="btn" id="loadBtn">Choose folder</button>
      </div>
    </div>

    <div class="card">
      <div id="hint">
        The browser requires you to explicitly select a folder. The path will appear here after selection.
      </div>
      <div class="playlist-toolbar">
        <input type="text" id="searchInput" placeholder="🔍 Search in playlist...">
        <button id="searchClearBtn" title="Clear search" disabled>Clear</button>
        <select id="sortSelect">
          <option value="alpha">Name (A–Z)</option>
          <option value="alpha-desc">Name (Z–A)</option>
          <option value="none">Original order</option>
        </select>
      </div>
      <ul class="playlist" id="playlist"><li class="empty">No tracks loaded</li></ul>
    </div>

    <div class="card">
      <div class="comandi">
        <button class="ctrl-btn play" id="playBtn" title="Play/Pause">
          <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" id="nextBtn" title="Next">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="ctrl-btn" id="clearBtn" title="Stop and clear playlist" disabled>
          <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
        </button>
        <div class="now-playing">
          <span class="title" id="nowTitle">—</span>
          <span id="nowState">waiting</span>
        </div>
      </div>

      <div class="progress-row">
        <span class="time" id="curTime">0:00</span>
        <input type="range" id="progress" min="0" max="1000" value="0" step="1" disabled>
        <span class="time right" id="durTime">0:00</span>
      </div>
    </div>

    <div class="card">
      <label class="random-row">
        <span class="switch">
          <input type="checkbox" id="randomcheck" checked>
          <span class="slider"></span>
        </span>
        <span>Shuffle playback</span>
      </label>
    </div>

    <div class="footer">
      Made by <a href="https://www.ilbak.it/" target="_blank" rel="noopener noreferrer">BaK</a>
    </div>
  </div>

  <audio id="audio" preload="metadata"></audio>

<script>
(function () {
  "use strict";
  const AUDIO_EXTS = [".mp3", ".m4a", ".opus"];

  const LS_KEY      = "musicPlayer.settings.v1";
  const IDB_NAME    = "musicPlayerDB";
  const IDB_STORE   = "handles";
  const IDB_KEY_DIR = "lastDir";

  const pathform      = document.getElementById("pathform");
  const hint          = document.getElementById("hint");
  const loadBtn       = document.getElementById("loadBtn");
  const refreshBtn    = document.getElementById("refreshBtn");
  const playlistEl    = document.getElementById("playlist");
  const searchInput   = document.getElementById("searchInput");
  const searchClearBtn= document.getElementById("searchClearBtn");
  const sortSelect    = document.getElementById("sortSelect");
  const playBtn       = document.getElementById("playBtn");
  const playIcon      = document.getElementById("playIcon");
  const nextBtn       = document.getElementById("nextBtn");
  const clearBtn      = document.getElementById("clearBtn");
  const nowTitle      = document.getElementById("nowTitle");
  const nowState      = document.getElementById("nowState");
  const randomCheck   = document.getElementById("randomcheck");
  const audio         = document.getElementById("audio");
  const progress      = document.getElementById("progress");
  const curTime       = document.getElementById("curTime");
  const durTime       = document.getElementById("durTime");

  let tracks = [];
  let viewTracks = [];
  let trackMap = new Map();
  let currentIndex = -1;
  let currentName = "";
  let dragging = false;
  let folderName = "";

  // ---------- Utilities ----------
  const isAudio = name => AUDIO_EXTS.some(ext => name.toLowerCase().endsWith(ext));

  const fmtTime = s => {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const ss = Math.floor(s % 60).toString().padStart(2, "0");
    return m + ":" + ss;
  };

  const ICON_PLAY  = '<path d="M8 5v14l11-7z"/>';
  const ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const setIcon = playing => playIcon.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;

  function updateClearBtn() {
    clearBtn.disabled = tracks.length === 0;
    searchClearBtn.disabled = searchInput.value.length === 0;
  }

  function updateHint(extra) {
    if (folderName && tracks.length > 0) {
      const shown = viewTracks.length;
      const total = tracks.length;
      let text = folderName + " — ";
      if (searchInput.value.trim() !== "" && shown !== total) {
        text += `${shown} of ${total} tracks`;
      } else {
        text += `${total} track${total === 1 ? "" : "s"}`;
      }
      if (extra) text += " · " + extra;
      hint.textContent = text;
    } else if (folderName) {
      hint.textContent = folderName + (extra ? " · " + extra : "");
    } else {
      hint.textContent = extra ||
        "The browser requires you to explicitly select a folder. The path will appear here after selection.";
    }
  }

  // ---------- Progress ----------
  function updateTimeUI(cur, dur) {
    curTime.textContent = fmtTime(cur);
    if (isFinite(dur) && dur > 0) {
      durTime.textContent = "-" + fmtTime(dur - cur);
    } else {
      durTime.textContent = "0:00";
    }
    if (!dragging && isFinite(dur) && dur > 0) {
      progress.value = String(Math.round((cur / dur) * 1000));
    }
  }

  audio.addEventListener("loadedmetadata", () => {
    progress.disabled = !isFinite(audio.duration) || audio.duration === 0;
    updateTimeUI(audio.currentTime, audio.duration);
  });
  audio.addEventListener("durationchange", () => {
    progress.disabled = !isFinite(audio.duration) || audio.duration === 0;
    updateTimeUI(audio.currentTime, audio.duration);
  });
  audio.addEventListener("timeupdate", () => {
    updateTimeUI(audio.currentTime, audio.duration);
  });
  audio.addEventListener("ended", () => { if (viewTracks.length) nextTrack(); });

  progress.addEventListener("input", () => {
    dragging = true;
    const dur = audio.duration;
    if (isFinite(dur) && dur > 0) {
      const t = (Number(progress.value) / 1000) * dur;
      curTime.textContent = fmtTime(t);
      durTime.textContent = "-" + fmtTime(dur - t);
    }
  });
  progress.addEventListener("change", () => {
    const dur = audio.duration;
    if (isFinite(dur) && dur > 0) {
      audio.currentTime = (Number(progress.value) / 1000) * dur;
    }
    dragging = false;
    updateTimeUI(audio.currentTime, audio.duration);
  });

  // ---------- Sorting ----------
  function getSortedList() {
    const mode = sortSelect.value;
    const list = Array.from(trackMap.values());
    if (mode === "none") return list;
    const sorted = list.slice().sort((a, b) =>
      a.name.localeCompare(b.name, "en", { sensitivity: "base" })
    );
    if (mode === "alpha-desc") sorted.reverse();
    return sorted;
  }

  function applySortingAndFilter() {
    tracks = getSortedList();

    const q = searchInput.value.trim().toLowerCase();
    if (q) {
      viewTracks = tracks.filter(t => t.name.toLowerCase().includes(q));
    } else {
      viewTracks = tracks;
    }

    if (currentName) {
      currentIndex = viewTracks.findIndex(t => t.name === currentName);
    } else {
      currentIndex = -1;
    }

    renderPlaylist();
    updateActive();
    updateClearBtn();
    updateHint();
  }

  // ---------- Rendering ----------
  function renderPlaylist() {
    playlistEl.innerHTML = "";
    if (viewTracks.length === 0) {
      if (tracks.length === 0) {
        playlistEl.innerHTML = '<li class="empty">No tracks loaded</li>';
      } else {
        playlistEl.innerHTML = '<li class="empty">No results</li>';
      }
      return;
    }
    viewTracks.forEach((t, i) => {
      const li = document.createElement("li");
      li.dataset.index = i;
      if (i === currentIndex) li.classList.add("active");
      li.innerHTML = `<span class="idx">${String(i+1).padStart(2,"0")}</span><span class="name"></span>`;
      li.querySelector(".name").textContent = t.name;
      li.addEventListener("click", () => playTrack(i));
      playlistEl.appendChild(li);
    });
  }

  function updateActive() {
    [...playlistEl.children].forEach(li => {
      if (!li.dataset.index) return;
      li.classList.toggle("active", Number(li.dataset.index) === currentIndex);
    });
    const active = playlistEl.querySelector("li.active");
    if (active) active.scrollIntoView({ block: "nearest", behavior: "smooth" });
    updateClearBtn();
  }

  // ---------- localStorage ----------
  function loadSettings() {
    try { const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }
    catch { return null; }
  }
  function saveSettings() {
    const data = {
      pathName:    pathform.value || "",
      currentName: currentName || "",
      random:      randomCheck.checked,
      sort:        sortSelect.value
    };
    try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
  }
  function clearSettings() { try { localStorage.removeItem(LS_KEY); } catch {} }

  // ---------- IndexedDB ----------
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE);
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function saveDirHandle(handle) {
    try {
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(handle, IDB_KEY_DIR);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
      db.close();
    } catch (e) { console.warn("saveDirHandle:", e); }
  }
  async function loadDirHandle() {
    try {
      const db = await openDB();
      const handle = await new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(IDB_KEY_DIR);
        req.onsuccess = () => res(req.result || null);
        req.onerror = () => rej(req.error);
      });
      db.close();
      return handle;
    } catch { return null; }
  }
  async function deleteDirHandle() {
    try {
      const db = await openDB();
      await new Promise((res, rej) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(IDB_KEY_DIR);
        tx.oncomplete = () => res();
        tx.onerror = () => rej(tx.error);
      });
      db.close();
    } catch {}
  }

  async function ensurePermission(handle, interactive = true) {
    const opts = { mode: "read" };
    try { if ((await handle.queryPermission(opts)) === "granted") return true; } catch {}
    if (!interactive) return false;
    try { return (await handle.requestPermission(opts)) === "granted"; } catch { return false; }
  }

  // ---------- Playback ----------
  function playTrack(index) {
    if (index < 0 || index >= viewTracks.length) return;
    currentIndex = index;
    currentName = viewTracks[index].name;
    const track = viewTracks[index];
    audio.src = track.url;
    nowTitle.textContent = track.name;
    nowState.textContent = "playing";
    progress.value = "0";
    progress.disabled = true;
    updateTimeUI(0, 0);
    audio.play().then(() => setIcon(true)).catch(() => {
      setIcon(false);
      nowState.textContent = "press play";
    });
    updateActive();
    saveSettings();
  }

  function togglePlay() {
    if (viewTracks.length === 0) return;
    if (currentIndex === -1) { playTrack(Math.floor(Math.random() * viewTracks.length)); return; }
    if (audio.paused) audio.play().then(() => { setIcon(true); nowState.textContent = "playing"; });
    else { audio.pause(); setIcon(false); nowState.textContent = "paused"; }
  }

  function getNextIndex() {
    if (viewTracks.length === 0) return -1;
    if (randomCheck.checked) {
      if (viewTracks.length === 1) return 0;
      let next;
      do { next = Math.floor(Math.random() * viewTracks.length); } while (next === currentIndex);
      return next;
    }
    return (currentIndex + 1) % viewTracks.length;
  }
  function nextTrack() { if (viewTracks.length) playTrack(getNextIndex()); }

  // ---------- Clear (playlist) ----------
  async function clearAll() {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    setIcon(false);
    Array.from(trackMap.values()).forEach(t => URL.revokeObjectURL(t.url));
    trackMap = new Map();
    tracks = [];
    viewTracks = [];
    currentIndex = -1;
    currentName = "";
    folderName = "";
    pathform.value = "";
    searchInput.value = "";
    nowTitle.textContent = "—";
    nowState.textContent = "waiting";
    progress.value = "0";
    progress.disabled = true;
    updateTimeUI(0, 0);
    renderPlaylist();
    updateClearBtn();
    updateHint();
    clearSettings();
    await deleteDirHandle();
  }

  // ---------- File reading ----------
  async function readAudioFilesFromDir(dirHandle) {
    const files = [];
    for await (const entry of dirHandle.values()) {
      if (entry.kind === "file" && isAudio(entry.name)) {
        const file = await entry.getFile();
        files.push({ name: file.name, file });
      }
    }
    return files;
  }

  async function populateFromFiles(files, preferredName) {
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    Array.from(trackMap.values()).forEach(t => URL.revokeObjectURL(t.url));
    trackMap = new Map();
    tracks = [];
    viewTracks = [];
    currentIndex = -1;
    currentName = "";
    setIcon(false);
    progress.value = "0";
    progress.disabled = true;
    updateTimeUI(0, 0);

    for (const { name, file } of files) {
      trackMap.set(name, { name, url: URL.createObjectURL(file) });
    }

    applySortingAndFilter();

    nowTitle.textContent = "—";

    if (viewTracks.length > 0) {
      let idx = preferredName ? viewTracks.findIndex(t => t.name === preferredName) : -1;
      if (idx < 0) idx = Math.floor(Math.random() * viewTracks.length);
      return idx;
    }
    saveSettings();
    return -1;
  }

  async function populateFromHandle(dirHandle, preferredName) {
    folderName = dirHandle.name;
    pathform.value = dirHandle.name;
    const files = await readAudioFilesFromDir(dirHandle);
    return populateFromFiles(files, preferredName);
  }

  // ---------- Manual loading ----------
  async function loadFolder() {
    if (!("showDirectoryPicker" in window)) {
      updateHint("Your browser does not support the File System Access API. Use Chrome, Edge or Opera.");
      return;
    }
    try {
      const dirHandle = await window.showDirectoryPicker({ mode: "read" });
      await saveDirHandle(dirHandle);
      const idx = await populateFromHandle(dirHandle, null);
      if (idx >= 0) playTrack(idx);
    } catch (err) {
      if (err.name !== "AbortError") updateHint("Error: " + err.message);
    }
  }

  // ---------- Refresh ----------
  async function refreshCurrent() {
    const wantedName = pathform.value.trim();
    if (!wantedName) {
      updateHint('No folder specified. Select it with "Choose folder".');
      return;
    }
    if (!("showDirectoryPicker" in window)) {
      updateHint("Your browser does not support the File System Access API. Use Chrome, Edge or Opera.");
      return;
    }

    const savedHandle = await loadDirHandle();
    let dirHandle = null;

    if (savedHandle && savedHandle.name === wantedName) {
      const ok = await ensurePermission(savedHandle, true);
      if (ok) dirHandle = savedHandle;
      else {
        updateHint("Permission denied for folder \"" + wantedName + "\". Reopen it with \"Choose folder\".");
        return;
      }
    }

    if (!dirHandle) {
      updateHint("Folder \"" + wantedName + "\" is no longer stored. Reselect it to refresh.");
      try {
        dirHandle = await window.showDirectoryPicker({ mode: "read" });
      } catch (err) {
        if (err.name !== "AbortError") updateHint("Error: " + err.message);
        return;
      }
      await saveDirHandle(dirHandle);
    }

    const preferred = currentName || null;
    const wasPlaying = !audio.paused;
    try {
      const idx = await populateFromHandle(dirHandle, preferred);
      if (idx >= 0 && wasPlaying) {
        playTrack(idx);
      } else if (idx >= 0) {
        currentIndex = idx;
        currentName = viewTracks[idx].name;
        updateActive();
        nowTitle.textContent = viewTracks[idx].name;
        nowState.textContent = "ready";
        saveSettings();
      }
    } catch (e) {
      updateHint("Unable to re-read folder: " + e.message);
    }
  }

  // ---------- Bootstrap ----------
  async function bootstrap() {
    setIcon(false);
    updateClearBtn();
    progress.disabled = true;

    const settings = loadSettings();

    if (settings && typeof settings.random === "boolean") {
      randomCheck.checked = settings.random;
    }
    if (settings && settings.sort) {
      sortSelect.value = settings.sort;
    }
    if (settings && settings.pathName) {
      pathform.value = settings.pathName;
      folderName = settings.pathName;
    }

    const dirHandle = await loadDirHandle();
    if (!dirHandle) {
      if (settings && settings.pathName) {
        updateHint("Last folder: " + settings.pathName +
          '. Press "Refresh" or "Choose folder" to reopen it.');
      } else {
        updateHint();
      }
      return;
    }

    updateHint('Restoring folder "' + dirHandle.name + '"…');
    const granted = await ensurePermission(dirHandle, true);
    if (!granted) {
      updateHint("Permission for folder \"" + dirHandle.name +
        "\" not granted. Press \"Refresh\" or \"Choose folder\" to reopen it.");
      return;
    }

    try {
      const preferred = settings && settings.currentName ? settings.currentName : null;
      const idx = await populateFromHandle(dirHandle, preferred);
      if (idx >= 0) playTrack(idx);
    } catch (e) {
      updateHint("Unable to read folder: " + e.message);
    }
  }

  // ---------- Events ----------
  loadBtn.addEventListener("click", loadFolder);
  refreshBtn.addEventListener("click", refreshCurrent);
  playBtn.addEventListener("click", togglePlay);
  nextBtn.addEventListener("click", nextTrack);
  clearBtn.addEventListener("click", clearAll);
  randomCheck.addEventListener("change", saveSettings);

  sortSelect.addEventListener("change", () => {
    applySortingAndFilter();
    saveSettings();
  });

  searchInput.addEventListener("input", () => {
    applySortingAndFilter();
  });

  searchClearBtn.addEventListener("click", () => {
    searchInput.value = "";
    applySortingAndFilter();
    searchInput.focus();
  });

  audio.addEventListener("play",  () => setIcon(true));
  audio.addEventListener("pause", () => setIcon(false));

  document.addEventListener("keydown", e => {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); togglePlay(); }
  });

  window.addEventListener("beforeunload", saveSettings);

  bootstrap();
})();
</script>
</body>
</html>
